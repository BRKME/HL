name: barrier

# Даёт ли выбор стопа и цели преимущество сам по себе. Вручную.

on:
  workflow_dispatch:
    inputs:
      coins:
        description: "Монеты через запятую"
        required: false
        default: "BTC,ETH"
      max_bars:
        description: "Окно ожидания, часов"
        required: false
        default: "240"

permissions:
  contents: read

jobs:
  barrier:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      BARRIER_COINS: ${{ inputs.coins }}
      BARRIER_MAX_BARS: ${{ inputs.max_bars }}
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 1 }
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: python scripts/barrier_run.py
