name: vol-premium

# Замер премии за волатильность на данных Aevo. Ежедневно: подразумеваемая
# меняется каждый день, и выборку надо копить.

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  premium:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 1 }
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: python scripts/vol_premium_run.py
      - name: Commit premium journal
        run: |
          set +e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f "state/vol_premium.jsonl" ]; then
            git add state/vol_premium.jsonl || true
          fi
          if git diff --cached --quiet; then
            echo "no premium changes"
            exit 0
          fi
          git commit -m "state: vol premium $(date -u +%Y-%m-%d) [skip ci]"
          git push
