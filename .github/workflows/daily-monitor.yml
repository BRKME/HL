name: daily-monitor

on:
  schedule:
    # Каждые 2 часа с 10:00 до 22:00 MSK (07:00 до 19:00 UTC)
    # 7 запусков: 10, 12, 14, 16, 18, 20, 22 MSK
    # Старт сдвинут 07->05 UTC (23.08): Actions доставляет с задержкой 1-3 ч,
    # и утренняя сводка приходила в 12-13 МСК вместо 10:00. Ценой одного
    # лишнего прогона в сутки.
    - cron: "0 5-19/2 * * *"
  workflow_dispatch:
    inputs:
      debug_sl:
        description: "Dump raw frontendOpenOrders to state/_sl_debug.json"
        type: boolean
        default: false

permissions:
  contents: write  # needed if DEBUG_SL writes state/_sl_debug.json

concurrency:
  group: hl-daily-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TELEGRAM_OWNER_CHAT_ID: ${{ secrets.TELEGRAM_OWNER_CHAT_ID }}
      # Optional: lifts GitHub unauth rate limit on /commits API (oracai_history)
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt

      - name: Run daily monitor
        env:
          DEBUG_SL: ${{ inputs.debug_sl && '1' || '' }}
        run: python -m src.daily_monitor

      - name: Commit debug dump if produced
        if: ${{ inputs.debug_sl }}
        run: |
          if [ -f state/_sl_debug.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state/_sl_debug.json state/last_channel_send.txt
            git commit -m "debug(daily-monitor): SL dump [skip ci]" || true
            git push || true
          fi

      - name: Commit verdict journal
        run: |
          set +e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f "state/verdict_journal.jsonl" ]; then
            git add state/verdict_journal.jsonl || true
          fi
          # Маркер «дайджест за сегодня уже отправлен». Без коммита он
          # теряется между прогонами, и утренний дайджест улетал бы каждые
          # 2 часа вместо одного раза в день.
          if [ -f "state/morning_digest.json" ]; then
            git add state/morning_digest.json || true
          fi
          # Маркер суточного сбора вердиктов. Без коммита он терялся между
          # прогонами и сбор шёл на каждом тике окна: 36 записей в день
          # вместо 9 (найдено 21.08 — то же правило, §4.3).
          if [ -f "state/verdict_collection.json" ]; then
            git add state/verdict_collection.json || true
          fi
          # Пометка отправки сводки — отдельная от пометки сбора (27.08):
          # данные повторять не нужно, а не ушедшее сообщение стоит
          # попробовать снова на следующем прогоне внутри окна.
          if [ -f "state/digest_sent.json" ]; then
            git add state/digest_sent.json || true
          fi
          # Прошлый состав сводки — для отметки «🆕 / N-й день». Без
          # коммита теряется между прогонами, и каждый сигнал выглядел бы
          # новым (30.08).
          if [ -f "state/digest_prev.json" ]; then
            git add state/digest_prev.json || true
          fi
          if git diff --cached --quiet; then
            echo "no verdict journal changes to commit"
            exit 0
          fi
          TS=$(date -u +"%Y-%m-%dT%H:%MZ")
          git commit -m "chore(daily-monitor): journal update ${TS} [skip ci]"
          for i in 1 2 3; do
            if git push; then break; fi
            git pull --rebase --autostash
            sleep $((i * 2))
          done
