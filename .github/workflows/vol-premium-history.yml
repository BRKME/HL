name: vol-premium-history

# Премия за волатильность по истории DVOL (Deribit), а не накоплением.
# Вручную: это разовый замер, а не регулярный отчёт.

on:
  workflow_dispatch:
    inputs:
      years:
        description: "Глубина истории, лет"
        required: false
        default: "5"

permissions:
  contents: read

jobs:
  premium:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      VOL_YEARS: ${{ inputs.years }}
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 1 }
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: python scripts/vol_premium_history.py
