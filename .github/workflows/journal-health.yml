name: journal-health

# Детектор тихого отказа. Появился 03.08 после того, как whitelist_focus
# перестал писать 06.07 и это заметили только через четыре недели: канал
# продолжал говорить каждые 2 часа, поэтому heartbeat молчал, а healthcheck
# никто не запускал. Здесь он запускается сам и кричит в Telegram.

on:
  schedule:
    - cron: "0 16 * * *"   # 19:00 MSK, после дневных прогонов
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read      # список упавших прогонов для actions_health_alert

concurrency:
  group: hl-journal-health
  cancel-in-progress: false

jobs:
  journal-health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run healthcheck and alert
        run: python scripts/journal_health_alert.py

      # Упавшие прогоны по расписанию — в канал (12.11.2026): за два месяца
      # их было 20, и ни об одном канал не узнал. always(): проверка нужна
      # и тогда, когда шаг выше завершился с ошибкой.
      - name: Report failed scheduled runs
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/actions_health_alert.py
